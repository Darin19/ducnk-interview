<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de2e6"/>
      <stop offset="1" stop-color="#2196f3"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cff6e"/>
      <stop offset="1" stop-color="#36d399"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2de2e6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#36d399"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ff6b6b"/>
    </marker>
    <style>
      .title{font:800 44px "Segoe UI",Inter,Arial,sans-serif;fill:#f8fbff;letter-spacing:.2px}
      .subtitle{font:500 18px "Segoe UI",Inter,Arial,sans-serif;fill:#a9bad6}
      .h{font:800 20px "Segoe UI",Inter,Arial,sans-serif;fill:#f8fbff}
      .k{font:700 14px "Segoe UI",Inter,Arial,sans-serif;fill:#aeefff;text-transform:uppercase;letter-spacing:1.1px}
      .txt{font:500 14px "Segoe UI",Inter,Arial,sans-serif;fill:#cad7ec}
      .small{font:500 12px "Segoe UI",Inter,Arial,sans-serif;fill:#9fb0cc}
      .mini{font:600 11px "Segoe UI",Inter,Arial,sans-serif;fill:#7f91ad}
      .pillText{font:700 12px "Segoe UI",Inter,Arial,sans-serif;fill:#07111f}
      .panel{fill:url(#panel);stroke:#263854;stroke-width:1.2;rx:18;filter:url(#shadow)}
      .card{fill:#101b2c;stroke:#314158;stroke-width:1;rx:13}
      .card2{fill:#0b1525;stroke:#2b3e59;stroke-width:1;rx:12}
      .cyanStroke{stroke:#2de2e6;stroke-width:3;fill:none;marker-end:url(#arrowCyan)}
      .greenStroke{stroke:#36d399;stroke-width:3;fill:none;marker-end:url(#arrowGreen)}
      .redStroke{stroke:#ff6b6b;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowRed)}
      .thin{stroke-width:2}
      .mutedLine{stroke:#2a3b55;stroke-width:1}
      .dot{fill:#2de2e6}
      .data{fill:#08111f;stroke:#32465f;stroke-width:1;rx:10}
    </style>
  </defs>

  <rect width="1800" height="1260" fill="url(#bg)"/>
  <circle cx="1660" cy="98" r="180" fill="#1d4ed8" opacity=".10"/>
  <circle cx="160" cy="1120" r="220" fill="#e11d48" opacity=".10"/>
  <path d="M60 104 C390 10 520 184 890 90 C1220 8 1400 84 1740 42" stroke="#2de2e6" stroke-width="1" opacity=".18" fill="none"/>

  <text x="70" y="72" class="title">FPT Shop CDP Architecture</text>
  <text x="70" y="103" class="subtitle">Luồng thu thập dữ liệu khách hàng từ browser/Snowplow tới Insider One CDP, identity graph, activation và feedback loop</text>

  <g transform="translate(1245,50)">
    <rect x="0" y="0" width="455" height="76" rx="18" fill="#0a1424" stroke="#293d59"/>
    <circle cx="30" cy="26" r="7" fill="#2de2e6"/><text x="47" y="31" class="small">First-party event stream</text>
    <circle cx="205" cy="26" r="7" fill="#36d399"/><text x="222" y="31" class="small">CDP activation loop</text>
    <line x1="27" y1="55" x2="63" y2="55" class="redStroke thin"/><text x="76" y="59" class="small">Third-party egress / ads sync</text>
  </g>

  <!-- Column panels -->
  <g id="columns">
    <rect x="70" y="155" width="255" height="790" class="panel"/>
    <rect x="360" y="155" width="285" height="790" class="panel"/>
    <rect x="680" y="155" width="285" height="790" class="panel"/>
    <rect x="1000" y="155" width="305" height="790" class="panel"/>
    <rect x="1340" y="155" width="350" height="790" class="panel"/>
  </g>

  <!-- Headings -->
  <text x="92" y="198" class="k">01 Customer touchpoints</text>
  <text x="92" y="228" class="h">FPT Shop journey</text>
  <text x="382" y="198" class="k">02 Browser collection</text>
  <text x="382" y="228" class="h">SDK, pixels, storage</text>
  <text x="702" y="198" class="k">03 First-party intake</text>
  <text x="702" y="228" class="h">PAPI + Snowplow</text>
  <text x="1022" y="198" class="k">04 Processing layer</text>
  <text x="1022" y="228" class="h">Identity + governance</text>
  <text x="1362" y="198" class="k">05 Insider One</text>
  <text x="1362" y="228" class="h">CDP + orchestration</text>

  <!-- Column 1 cards -->
  <g transform="translate(92,262)">
    <rect width="211" height="82" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Known customer</text>
    <text x="18" y="52" class="txt">Login, cart, order</text>
    <text x="18" y="70" class="small">phoneNumber, token, sessionId</text>
  </g>
  <g transform="translate(92,366)">
    <rect width="211" height="82" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Anonymous visitor</text>
    <text x="18" y="52" class="txt">Category, PDP, banner</text>
    <text x="18" y="70" class="small">cookie ids, referrer, device</text>
  </g>
  <g transform="translate(92,470)">
    <rect width="211" height="96" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Commerce actions</text>
    <text x="18" y="52" class="txt">Variant, add cart, voucher</text>
    <text x="18" y="70" class="small">SKU, UPC, price, quantity</text>
    <text x="18" y="87" class="small">promotion code, loyalty</text>
  </g>
  <g transform="translate(92,588)">
    <rect width="211" height="96" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Engagement signals</text>
    <text x="18" y="52" class="txt">Scroll, media, click</text>
    <text x="18" y="70" class="small">DOM text, destination URL</text>
    <text x="18" y="87" class="small">time-on-page, viewport</text>
  </g>
  <g transform="translate(92,706)">
    <rect width="211" height="100" class="card2"/>
    <text x="18" y="28" class="h" font-size="17">Possible forms</text>
    <text x="18" y="52" class="txt">Comment, lead, profile</text>
    <text x="18" y="70" class="small">name, phone, email, gdpr</text>
    <text x="18" y="87" class="mini">Observed source; comment POST not captured</text>
  </g>

  <!-- Column 2 cards -->
  <g transform="translate(382,262)">
    <rect width="241" height="88" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Next.js API client</text>
    <text x="18" y="52" class="txt">/_next/static/chunks/73463...</text>
    <text x="18" y="70" class="small">Authorization + order-channel</text>
  </g>
  <g transform="translate(382,374)">
    <rect width="241" height="104" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Snowplow tracker</text>
    <text x="18" y="52" class="txt">/script/sp.js</text>
    <text x="18" y="70" class="small">trackPageView, add_to_cart</text>
    <text x="18" y="88" class="small">duid, sid, uid, cx, ue_px</text>
  </g>
  <g transform="translate(382,502)">
    <rect width="241" height="106" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Insider SDK</text>
    <text x="18" y="52" class="txt">ins.js?id=10001396</text>
    <text x="18" y="70" class="small">UCD cart + browse collection</text>
    <text x="18" y="88" class="small">spUID, segments, last viewed</text>
  </g>
  <g transform="translate(382,632)">
    <rect width="241" height="112" class="card2"/>
    <text x="18" y="28" class="h" font-size="17">Client storage</text>
    <text x="18" y="52" class="txt">Cookies, localStorage, session</text>
    <text x="18" y="70" class="small">cartSessionId, oidc.*, _sp_*</text>
    <text x="18" y="88" class="small">_ga, _fbp, ttcsid, __uidac</text>
  </g>
  <g transform="translate(382,770)">
    <rect width="241" height="92" class="card2"/>
    <text x="18" y="28" class="h" font-size="17">Pixels + RUM</text>
    <text x="18" y="52" class="txt">Meta, TikTok, GA, Admicro</text>
    <text x="18" y="70" class="small">auto click, scroll, conversion</text>
  </g>

  <!-- Column 3 cards -->
  <g transform="translate(702,262)">
    <rect width="241" height="112" class="card"/>
    <text x="18" y="28" class="h" font-size="17">PAPI / BFF Order</text>
    <text x="18" y="52" class="txt">papi.fptshop.com.vn</text>
    <text x="18" y="70" class="small">cart, voucher, loyalty, profile</text>
    <text x="18" y="88" class="small">phoneNumber + sessionId + SKU</text>
  </g>
  <g transform="translate(702,400)">
    <rect width="241" height="104" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Snowplow collector</text>
    <text x="18" y="52" class="txt">octopus-stream01-cads.fpt.vn</text>
    <text x="18" y="70" class="small">/com.fpt/301</text>
    <text x="18" y="88" class="small">schema, event, context payload</text>
  </g>
  <g transform="translate(702,530)">
    <rect width="241" height="98" class="card2"/>
    <text x="18" y="28" class="h" font-size="17">Operational systems</text>
    <text x="18" y="52" class="txt">Order, CRM, loyalty, product</text>
    <text x="18" y="70" class="small">price, discount, promotion</text>
    <text x="18" y="87" class="small">customer profile + order history</text>
  </g>
  <g transform="translate(702,654)">
    <rect width="241" height="88" class="card2"/>
    <text x="18" y="28" class="h" font-size="17">Cloudflare RUM</text>
    <text x="18" y="52" class="txt">fptshop.com.vn/cdn-cgi/rum</text>
    <text x="18" y="70" class="small">performance + page telemetry</text>
  </g>
  <g transform="translate(702,766)">
    <rect width="241" height="94" class="card2"/>
    <text x="18" y="28" class="h" font-size="17">Server enrichment</text>
    <text x="18" y="52" class="txt">Product catalog + geography</text>
    <text x="18" y="70" class="small">brandId, sectorId, location</text>
  </g>

  <!-- Column 4 cards -->
  <g transform="translate(1022,262)">
    <rect width="261" height="104" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Schema validation</text>
    <text x="18" y="52" class="txt">Snowplow self-describing events</text>
    <text x="18" y="70" class="small">page_view, add_to_cart, custom ue_px</text>
    <text x="18" y="88" class="small">bad rows / QA / replay</text>
  </g>
  <g transform="translate(1022,392)">
    <rect width="261" height="118" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Identity graph</text>
    <text x="18" y="52" class="txt">Known + anonymous stitching</text>
    <text x="18" y="70" class="small">phoneNumber, token, sessionId</text>
    <text x="18" y="88" class="small">duid, spUID, cid, fbp, ttcsid</text>
    <text x="18" y="106" class="small">hash / dedupe / merge rules</text>
  </g>
  <g transform="translate(1022,536)">
    <rect width="261" height="112" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Event lake / warehouse</text>
    <text x="18" y="52" class="txt">Behavioral + commerce facts</text>
    <text x="18" y="70" class="small">views, clicks, carts, vouchers</text>
    <text x="18" y="88" class="small">product, price, category, time</text>
  </g>
  <g transform="translate(1022,674)">
    <rect width="261" height="126" class="card2"/>
    <text x="18" y="28" class="h" font-size="17">Governance controls</text>
    <text x="18" y="52" class="txt">Consent, minimization, retention</text>
    <text x="18" y="70" class="small">PII hashing, purpose binding</text>
    <text x="18" y="88" class="small">partner routing policy</text>
    <text x="18" y="106" class="small">audit logs + data contracts</text>
  </g>

  <!-- Column 5 cards -->
  <g transform="translate(1362,262)">
    <rect width="286" height="112" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Insider One UCD</text>
    <text x="18" y="52" class="txt">Unified Customer Database</text>
    <text x="18" y="70" class="small">360 profile: known + anonymous</text>
    <text x="18" y="88" class="small">cart, browse, purchase, consent</text>
  </g>
  <g transform="translate(1362,400)">
    <rect width="286" height="112" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Segmentation + AI</text>
    <text x="18" y="52" class="txt">Predict intent, churn, affinity</text>
    <text x="18" y="70" class="small">browse/cart abandonment</text>
    <text x="18" y="88" class="small">discount affinity, next best action</text>
  </g>
  <g transform="translate(1362,538)">
    <rect width="286" height="118" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Journey orchestration</text>
    <text x="18" y="52" class="txt">Trigger, decisioning, frequency cap</text>
    <text x="18" y="70" class="small">event-based automation</text>
    <text x="18" y="88" class="small">real-time personalization</text>
    <text x="18" y="106" class="small">campaign experiments + goals</text>
  </g>
  <g transform="translate(1362,682)">
    <rect width="286" height="158" class="card"/>
    <text x="18" y="28" class="h" font-size="17">Activation channels</text>
    <text x="18" y="52" class="txt">Onsite, web/app push, email</text>
    <text x="18" y="70" class="txt">SMS, WhatsApp, ads audiences</text>
    <text x="18" y="96" class="small">Personalized banners, coupons</text>
    <text x="18" y="114" class="small">Cart/browse abandonment journeys</text>
    <text x="18" y="132" class="small">Paid media retargeting</text>
  </g>

  <!-- Data taxonomy band -->
  <g transform="translate(70,982)">
    <rect width="1235" height="160" rx="20" fill="#0a1424" stroke="#293d59" filter="url(#shadow)"/>
    <text x="24" y="36" class="k">Data taxonomy observed</text>
    <g transform="translate(24,58)">
      <rect width="230" height="86" class="data"/>
      <text x="16" y="26" class="h" font-size="16">Identity</text>
      <text x="16" y="48" class="small">phoneNumber, token, sessionId</text>
      <text x="16" y="66" class="small">duid, spUID, cid, fbp, ttcsid</text>
    </g>
    <g transform="translate(274,58)">
      <rect width="230" height="86" class="data"/>
      <text x="16" y="26" class="h" font-size="16">Behavior</text>
      <text x="16" y="48" class="small">page_view, click, scroll, media</text>
      <text x="16" y="66" class="small">referrer, URL, element text</text>
    </g>
    <g transform="translate(524,58)">
      <rect width="230" height="86" class="data"/>
      <text x="16" y="26" class="h" font-size="16">Commerce</text>
      <text x="16" y="48" class="small">SKU, UPC, variant, quantity</text>
      <text x="16" y="66" class="small">price, discount, voucher, cart</text>
    </g>
    <g transform="translate(774,58)">
      <rect width="230" height="86" class="data"/>
      <text x="16" y="26" class="h" font-size="16">Device + context</text>
      <text x="16" y="48" class="small">UA, OS, language, timezone</text>
      <text x="16" y="66" class="small">screen, viewport, cookies</text>
    </g>
    <g transform="translate(1024,58)">
      <rect width="170" height="86" class="data"/>
      <text x="16" y="26" class="h" font-size="16">Consent</text>
      <text x="16" y="48" class="small">cookie consent</text>
      <text x="16" y="66" class="small">gdpr opt-in fields</text>
    </g>
  </g>

  <!-- Third-party ecosystem band -->
  <g transform="translate(1340,982)">
    <rect width="350" height="160" rx="20" fill="#180f18" stroke="#4b2230" filter="url(#shadow)"/>
    <text x="22" y="36" class="k" fill="#ffd1dc">Third-party egress</text>
    <text x="22" y="62" class="txt">Meta Pixel, TikTok Pixel, GA4/GAds</text>
    <text x="22" y="84" class="txt">Admicro, CreativeCDN, RTB sync</text>
    <text x="22" y="112" class="small">Signals: product metadata, click features,</text>
    <text x="22" y="130" class="small">conversion labels, screen/device, referrer</text>
  </g>

  <!-- Arrows main -->
  <path d="M325 430 C350 430 350 430 378 430" class="cyanStroke"/>
  <path d="M623 430 C652 430 652 452 700 452" class="cyanStroke"/>
  <path d="M943 452 C980 452 986 316 1020 316" class="cyanStroke"/>
  <path d="M943 315 C980 315 985 448 1020 448" class="cyanStroke"/>
  <path d="M1283 590 C1312 590 1318 596 1360 596" class="greenStroke"/>
  <path d="M1283 448 C1314 448 1318 316 1360 316" class="greenStroke"/>
  <path d="M623 556 C670 556 666 316 700 316" class="greenStroke"/>
  <path d="M623 820 C680 820 668 1012 1338 1012" class="redStroke"/>
  <path d="M1648 760 C1725 760 1735 900 1305 900 C875 900 878 690 1283 690" class="greenStroke thin" opacity=".78"/>

  <!-- Arrows labels -->
  <g>
    <rect x="334" y="400" width="90" height="26" rx="13" fill="url(#cyan)"/>
    <text x="350" y="418" class="pillText">events</text>
    <rect x="646" y="383" width="112" height="26" rx="13" fill="url(#cyan)"/>
    <text x="662" y="401" class="pillText">Snowplow</text>
    <rect x="952" y="286" width="119" height="26" rx="13" fill="url(#cyan)"/>
    <text x="969" y="304" class="pillText">validated</text>
    <rect x="1250" y="416" width="124" height="26" rx="13" fill="url(#green)"/>
