    <rect x="613" y="517" width="126" height="26" rx="13" fill="url(#green)"/>
    <text x="629" y="535" class="pillText">direct UCD</text>
  </g>

  <!-- Key source strips -->
  <g transform="translate(70,1166)">
    <text x="0" y="0" class="mini">Source basis: Chrome DevTools audit report; FPT Snowplow / PAPI evidence from inspected requests; Insider One official docs describe UCD/CDP, unified profiles, segmentation, journey orchestration and cross-channel activation.</text>
    <text x="0" y="24" class="mini">Note: values are redacted. Diagram models likely production architecture inferred from observed browser/network flows plus standard CDP ingestion/activation patterns.</text>
  </g>

  <!-- Phase numbers -->
  <g opacity=".95">
    <circle cx="88" cy="174" r="18" fill="url(#cyan)"/><text x="82" y="180" class="pillText">1</text>
    <circle cx="378" cy="174" r="18" fill="url(#cyan)"/><text x="372" y="180" class="pillText">2</text>
    <circle cx="698" cy="174" r="18" fill="url(#cyan)"/><text x="692" y="180" class="pillText">3</text>
    <circle cx="1018" cy="174" r="18" fill="url(#violet)"/><text x="1012" y="180" class="pillText">4</text>
    <circle cx="1358" cy="174" r="18" fill="url(#green)"/><text x="1352" y="180" class="pillText">5</text>
  </g>
</svg>
